              "postalCode": "8600",
              "addressCountry": "Switzerland",

          }

    <script type="application/ld+json">

        "jurisdiction": {
          "@type": "Country",
          "name": "France"

        "inLanguage": "fr",
        "keywords": [
          "droit civil",
          "droit pénal",
          "droit du travail",
          "réglementation",
          "contentieux",
          "droit fiscal"
        ],
        "legislationLegalForce": {
          "@id": "https://schema.org/InForce"
        },
        "description": "Ensemble des textes de loi français couvrant le droit civil, pénal, du travail et autres domaines juridiques.",
        "workExample": [
          {
            "@type": "Legislation",
            "inLanguage": "fr",
            "encoding": [
              {
                "@type": "LegislationObject",
                "encodingFormat": "text/html",
                "legislationLegalValue": {
                  "@id": "https://schema.org/OfficialLegalValue"
                }
              }
            ]
          }
        ]
      }
